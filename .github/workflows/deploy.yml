name: Deploy Portfolio Site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test AppShield checker
        run: node appshield/checker.test.js
      - name: Test AppShield review request flow
        run: node appshield/request-review.test.js
      - name: Test AppShield paid intake flow
        run: node appshield/client-intake.test.js
      - name: Validate site structure and links
        run: node scripts/validate-site.mjs
      - name: Validate sitemap XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')"
      - name: Upload site to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
