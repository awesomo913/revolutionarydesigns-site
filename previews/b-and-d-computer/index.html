<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B &amp; D Computer — 6 designs</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:flex;flex-direction:column;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0e120f;color:#e6eae7}
  header{padding:12px 18px;border-bottom:1px solid #232b26;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header .who{min-width:0}
  header h1{margin:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header p{margin:2px 0 0;color:#9aa89f;font-size:12px}
  header .right{margin-left:auto;display:flex;gap:14px;align-items:center}
  header a{color:#8fc7b8;text-decoration:none;font-size:12px}
  .tabs{display:flex;gap:6px;padding:10px 14px;background:#161c18;border-bottom:1px solid #232b26;overflow-x:auto}
  .tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:#1d2620;
       border:1px solid #2c352e;color:#c7d1cb;border-radius:9px;padding:7px 13px;cursor:pointer;font:inherit;line-height:1.2;transition:.12s}
  .tab b{font-size:13px;color:#e6eae7}
  .tab span{font-size:11px;color:#8b998f}
  .tab:hover{border-color:#3a4a40}
  .tab[aria-selected="true"]{background:#2e6c61;border-color:#2e6c61}
  .tab[aria-selected="true"] b,.tab[aria-selected="true"] span{color:#0e120f}
  .tab:focus-visible{outline:2px solid #8fc7b8;outline-offset:2px}
  .stage{flex:1;position:relative;background:#fff}
  iframe{border:0;position:absolute;inset:0;width:100%;height:100%}
  .hint{color:#6b756f;font-size:11px}
  .notice{padding:8px 14px;background:#16201b;color:#9db8ab;font-size:12px;border-bottom:1px solid #232b26}
  @media(max-width:600px){.tab span{display:none}.hint{display:none}}
</style></head><body>
<div class="notice">Preview only — these are design concepts, not the live B &amp; D Computer website.</div>
<header>
  <div class="who"><h1>B &amp; D Computer</h1><p>Computer Sales &amp; Repair · Crittenden, KY</p></div>
  <div class="right"><span class="hint">press 1–6</span><a id="full" href="original/" target="_blank">Open full-screen &#8599;</a></div>
</header>
<div class="tabs" role="tablist">
  <button class="tab" role="tab" aria-selected="true" data-src="original/" data-key="1" id="tab-1"><b>1</b><span>Original</span></button>
  <button class="tab" role="tab" aria-selected="false" data-src="light/" data-key="2" id="tab-2"><b>2</b><span>Light</span></button>
  <button class="tab" role="tab" aria-selected="false" data-src="bold/" data-key="3" id="tab-3"><b>3</b><span>Bold</span></button>
  <button class="tab" role="tab" aria-selected="false" data-src="bench/" data-key="4" id="tab-4"><b>4</b><span>Bench</span></button>
  <button class="tab" role="tab" aria-selected="false" data-src="harlan/" data-key="5" id="tab-5"><b>5</b><span>Harlan</span></button>
  <button class="tab" role="tab" aria-selected="false" data-src="neighborly/" data-key="6" id="tab-6"><b>6</b><span>Neighborly</span></button>
</div>
<div class="stage"><iframe id="frame" src="original/" title="Selected design"></iframe></div>
<script>
(function(){
  var frame=document.getElementById('frame'),full=document.getElementById('full');
  var tabs=[].slice.call(document.querySelectorAll('.tab'));
  function pick(b){tabs.forEach(function(x){x.setAttribute('aria-selected','false');});
    b.setAttribute('aria-selected','true');frame.src=b.dataset.src;full.href=b.dataset.src;}
  tabs.forEach(function(b){b.addEventListener('click',function(){pick(b);});});
  addEventListener('keydown',function(e){
    if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
    var b=document.querySelector('.tab[data-key="'+e.key+'"]');
    if(b){pick(b);b.focus();}});
})();
</script>
</body></html>
